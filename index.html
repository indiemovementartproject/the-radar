<title>The Radar</title>
<style>
:root{--ink:#0e0c17;--panel:#221d38;--line:#3a3259;--gold:#f2b64c;--gold-dim:#a97f35;
--cyan:#5ce1e6;--rose:#ef6d8c;--text:#f4f1fa;--muted:#a49bbd;--faint:#6c6386}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--text);min-height:100dvh;display:flex;
align-items:center;justify-content:center;padding:24px;
font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
background-image:radial-gradient(46% 36% at 50% 22%,rgba(242,182,76,.13),transparent 70%)}
.lock{width:100%;max-width:360px;text-align:center}
svg.mark{width:78px;height:78px;margin-bottom:22px;overflow:visible}
.ring{fill:none;stroke:var(--gold);stroke-width:1.6;opacity:.5}
.r2{opacity:.72}.r3{opacity:1}
.sweep{transform-origin:50px 50px;animation:spin 4.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:27px;font-weight:900;letter-spacing:-.01em;line-height:1.05;text-transform:uppercase}
h1 span{color:var(--gold)}
p.sub{color:var(--muted);font-size:13.5px;margin-top:10px}
form{margin-top:22px;display:flex;flex-direction:column;gap:10px}
input[type=password]{background:var(--panel);border:1px solid var(--line);border-radius:12px;
color:var(--text);padding:14px;font-size:16px;width:100%;text-align:center;font-family:inherit}
input[type=password]:focus{outline:2px solid var(--gold-dim)}
button{font-family:inherit;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
padding:14px;border-radius:12px;border:none;background:var(--gold);color:#241a05;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.keep{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;
color:var(--muted);margin-top:2px;cursor:pointer;user-select:none}
.keep input{accent-color:var(--gold);width:15px;height:15px}
.msg{margin-top:14px;font-size:13px;min-height:19px;color:var(--rose)}
.hint{margin-top:24px;font-size:11px;color:var(--faint);line-height:1.6}
</style></head>
<body><div class="lock">
<svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
<circle class="ring" cx="50" cy="50" r="34"/><circle class="ring r2" cx="50" cy="50" r="23"/>
<circle class="ring r3" cx="50" cy="50" r="12"/><circle cx="50" cy="50" r="3.4" fill="var(--gold)"/>
<g class="sweep"><path d="M50 50 L50 16" stroke="var(--gold)" stroke-width="2"
stroke-linecap="round" opacity=".85"/></g>
<circle cx="77" cy="31" r="5.2" fill="var(--cyan)"/></svg>
<h1>The <span>radar</span></h1>
<p class="sub">This brief is encrypted. Enter your passphrase to read it.</p>
<form id="f" autocomplete="off">
<input id="p" type="password" placeholder="Passphrase" autocomplete="current-password"
 autocapitalize="off" autocorrect="off" spellcheck="false" required>
<label class="keep"><input type="checkbox" id="k" checked> Keep me unlocked on this device</label>
<button id="b" type="submit">Unlock</button>
</form>
<div class="msg" id="m"></div>
<p class="hint">Nothing readable is stored on this page &mdash; only ciphertext.<br>

var f=document.getElementById('f'),p=document.getElementById('p'),
    m=document.getElementById('m'),btn=document.getElementById('b'),keep=document.getElementById('k');

function open_(pass,remember){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
    .then(function(base){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(SALT),iterations:ITER,hash:'SHA-256'},
        base,{name:'AES-GCM',length:256},false,['decrypt']);
    })
    .then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},key,b(CT));
    })
    .then(function(pt){
      if(remember){try{localStorage.setItem(KEY,pass);}catch(e){}}
      var html=new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
    });
}

f.addEventListener('submit',function(e){
  e.preventDefault();
  btn.disabled=true; m.style.color='var(--muted)'; m.textContent='Decrypting\u2026';
  open_(p.value,keep.checked)['catch'](function(){
    m.style.color='var(--rose)'; m.textContent='Wrong passphrase.';
    btn.disabled=false; p.value=''; p.focus();
  });
});

/* Already unlocked on this device: go straight in. A stale saved passphrase
   (because the brief was re-encrypted with a new one) just falls back to the
   form rather than getting stuck. */
(function(){
  var saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  if(!saved){p.focus();return;}
  m.style.color='var(--muted)'; m.textContent='Unlocking\u2026'; btn.disabled=true;
  open_(saved,false)['catch'](function(){
    try{localStorage.removeItem(KEY);}catch(e){}
    m.textContent=''; btn.disabled=false; p.focus();
  });
})();
